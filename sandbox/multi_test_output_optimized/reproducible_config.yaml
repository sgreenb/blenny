steps:
- name: load_image
  params:
    max_dimension: null
- name: detect_multi_plate
  params:
    grid:
    - 2
    - 3
    radius_expand_frac: 0.02
    margin_frac: 0.02
    min_confidence_score: 0.05
- name: sub_pipeline
  params:
    max_subplate_dimension: 1280
    steps:
    - name: yolo_detector
      params:
        conf_threshold: 0.15
    - name: measure_colonies
    - name: export_annotated
      params:
        output_path: '{output_dir}/{stem}/{stem}_{plate_label}_annotated.png'
- name: export_csv
  params:
    output_path: '{output_dir}/{stem}/{stem}_results.csv'
- name: export_summary
  params:
    output_path: '{output_dir}/{stem}/{stem}_summary.txt'
_blenny_version: 0.0.1
