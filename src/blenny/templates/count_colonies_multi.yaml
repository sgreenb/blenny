# Pipeline for analyzing multiple Petri plates in a single scan (e.g. flatbed scanner)
# Configured with tuned defaults for high-precision edge-to-edge detection.

steps:
  - name: "load_image"
    params:
      max_dimension: null  # null = native resolution

  - name: "detect_multi_plate"
    params:
      grid: [2, 3]         # Change based on your scanner arrangement
      radius_scale: 1.0
      min_confidence_score: 0.20

  - name: "sub_pipeline"
    params:
      max_subplate_dimension: 1280
      steps:
        - name: "yolo_detector"
          params:
            conf_threshold: 0.15
        
        - name: "measure_colonies"

        - name: classify_by_interior
          # Reject edge-zone detections that don't match the interior colony
          # profile (rim arcs, cracks, pen marks). Tune with the GUI sliders
          # 'Interior Radius' and 'Max Eccentricity'.

        # Plate-level exports
        - name: "export_annotated"
          params:
            output_path: "{output_dir}/{stem}/{stem}_{plate_label}_annotated.png"

  # Scan-level unified exports
  - name: "export_csv"
    params:
      output_path: "{output_dir}/{stem}/{stem}_results.csv"

  - name: "export_summary"
    params:
      output_path: "{output_dir}/{stem}/{stem}_run_summary.txt"
