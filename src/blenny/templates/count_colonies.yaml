# Count colonies on a plate photo (classical CV pipeline).
#
# Run on a single image:
#   blenny run pipeline.yaml --input plate.jpg --output results/
#
# Run on a batch (the {stem} placeholder gives each image its own subdir):
#   blenny run pipeline.yaml --input "plates/*.jpg" --output results/
#
# Tweak any params below to suit your data. `blenny modules` lists every
# parameter and its default for every registered module.

steps:
  - name: load_image
    # Resize huge phone photos for tractable processing time. Set
    # max_dimension: null to load at native resolution (slower but exact).
    params:
      max_dimension: 2000

  - name: detect_plate
    params:
      # Expand the Hough-detected radius by 5% before margin trimming. Off-
      # axis phone photos make the plate elliptical; Hough then fits a circle
      # smaller than the true plate. Set to 0 for flatbed scans or perfectly
      # top-down shots; raise to 0.10 for clearly tilted images.
      radius_expand_frac: 0.05
      # Shrink the plate mask by 8% of the (expanded) radius to exclude the
      # bright reflective rim common in phone photos. Reduce to 0.03-0.05
      # for flatbed scans or if colonies grow close to the rim.
      margin_frac: 0.08
      crop: true

  - name: correct_illumination
    params:
      # Structuring-element radius in pixels. Should be larger than the
      # biggest colony but smaller than the lighting variation scale.
      method: white_tophat
      radius: 25

  - name: threshold_segment
    params:
      method: otsu
      roi_mask_key: plate
      split_touching: true
      # Shape filters drop rim arcs (low circularity) and pen scribbles
      # (low solidity). Set either to 0 to disable.
      min_circularity: 0.7
      min_solidity: 0.85

  - name: measure_colonies

  - name: classify_by_interior
    # Validates edge-zone detections against the interior colony profile.
    # Detections that don't match interior size/intensity/eccentricity are
    # marked is_artifact=True and excluded from the count. They remain in
    # the CSV for inspection. Tune interior_radius_frac and iqr_multiplier
    # if too many real edge colonies are being rejected.

  - name: export_csv
    params:
      output_path: "{output_dir}/{stem}/colonies.csv"
      include_provenance: true

  - name: export_annotated
    params:
      output_path: "{output_dir}/{stem}/annotated.png"
