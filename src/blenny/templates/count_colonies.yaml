# Count colonies on a plate photo (classical CV pipeline).
#
# Run on a single image:
#   blenny run pipeline.yaml --input plate.jpg --output results/
#
# Run on a batch (the {stem} placeholder gives each image its own subdir):
#   blenny run pipeline.yaml --input "plates/*.jpg" --output results/
#
# Tweak any params below to suit your data. `blenny modules` lists every
# parameter and its default for every registered module.

steps:
  - name: load_image
    # Images are loaded at native resolution by default.
    # Set max_dimension to an integer (e.g. 2000) to downscale large phone
    # photos and speed up processing at the cost of some precision.
    params:
      max_dimension: null

  - name: detect_plate
    params:
      # The detected radius is used as-is. Set to a value such as 0.05
      # to expand the detected radius if off-axis phone photos make
      # the plate appear elliptical.
      radius_expand_frac: 0.0
      # Shrink the plate mask by 4% of the radius to exclude the
      # bright reflective rim common in phone photos. Reduce to 0.02
      # for flatbed scans or if colonies grow close to the rim.
      margin_frac: 0.04
      crop: true

  - name: apply_exclusion_mask
    params:
      # Optional path to a manually-painted mask image.
      mask_path: null

  - name: correct_illumination
    params:
      # If radius is null (the default), it's automatically set to
      # plate_radius / 15, which scales with your image resolution.
      # Set an explicit pixel value here to override.
      method: white_tophat
      radius: null

  - name: threshold_segment
    params:
      method: otsu
      roi_mask_key: plate
      split_touching: true
      # Shape filters drop rim arcs (low circularity) and pen scribbles
      # (low solidity). Set either to 0 to disable.
      min_circularity: 0.75
      min_solidity: 0.90

  - name: add_manual_colonies
    # Used for manual researcher-in-the-loop interventions in the GUI.
    # Must run BEFORE measure_colonies so that manually added regions are
    # included in the segmentation mask before measurements are taken.
    params:
      coordinates: []

  - name: measure_colonies

  - name: estimate_multiplicity
    # Tag detections that look like fused / bilobed colonies (high solidity
    # but low circularity, area >= 1.8x a typical singleton) with
    # colony_count_estimate >= 2 so they contribute their estimated
    # multiplicity to the count instead of being rejected as area outliers.
    # Tagged detections are drawn in magenta with an x N suffix in the
    # annotated overlay.

  - name: classify_by_interior
    # Validates edge-zone detections against the interior colony profile.
    # Detections that don't match interior size/intensity/eccentricity/color
    # are marked is_artifact=True and excluded from the count. They remain in
    # the CSV for inspection. Tune interior_radius_frac and iqr_multiplier
    # if too many real edge colonies are being rejected.

  - name: filter_by_id
    # Used for manual researcher-in-the-loop interventions in the GUI.
    params:
      exclude_ids: []

  - name: export_csv
    params:
      output_path: "{output_dir}/{stem}/colonies.csv"

  - name: export_summary
    params:
      output_path: "{output_dir}/{stem}/log.txt"

  - name: export_annotated
    params:
      output_path: "{output_dir}/{stem}/annotated.png"
