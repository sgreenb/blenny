# Fully Automatic Colony Counting Pipeline (Facile + YOLO)
#
# This pipeline automatically detects one or multiple plates. 
# - If 1 plate is found: It analyzes it normally.
# - If >1 plates are found: It splits them into ROIs for individual review.

steps:
  - name: load_image
    params:
      max_dimension: null

  - name: detect_facile
    params:
      # 'null' enables automatic single/multi plate detection.
      multi_plate: null 
      radius_scale: 1.0
      crop: false

  - name: sub_pipeline
    params:
      max_subplate_dimension: 3200
      steps:
        - name: apply_exclusion_mask
          params:
            mask_path: null

        - name: yolo_detector
          params:
            model_path: "models/colony_model.pt"
            conf_threshold: 0.15
            iou_threshold: 0.8
            imgsz: 3200
            max_det: 3000
            refine_mask: true
            output_key: "objects"

        - name: add_manual_colonies
          params:
            coordinates: []

        - name: measure_colonies
          params:
            mask_key: "objects"
            roi_mask_key: "plate"

        - name: classify_by_interior
          # Reject edge-zone detections that don't match the interior colony
          # profile (rim arcs, cracks, pen marks). Tune with the GUI sliders
          # 'Interior Radius' and 'Max Eccentricity'.

        - name: filter_by_id
          params:
            exclude_ids: []

        - name: export_annotated
          params:
            output_path: "{output_dir}/{stem}/{stem}_{plate_label}_annotated.png"

  - name: export_csv
    params:
      output_path: "{output_dir}/{stem}/colonies.csv"

  - name: export_summary
    params:
      output_path: "{output_dir}/{stem}/log.txt"
