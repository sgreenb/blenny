[tool.poetry]
name = "blenny"
version = "1.0.0"
description = "A free, open-source toolkit for analyzing colonies on petri plates."
authors = ["The Blenny contributors"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/sgreenb/blenny"
repository = "https://github.com/sgreenb/blenny"
keywords = ["microscopy", "image-analysis", "colony-counting", "bioimage", "plates"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
packages = [{include = "blenny", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
numpy = ">=1.24,<2.0"
pydantic = ">=2.5"
pyyaml = ">=6.0"
pillow = ">=10"
scikit-image = ">=0.22"
scipy = ">=1.10"
typer = ">=0.12"
streamlit = ">=1.35"
streamlit-drawable-canvas = ">=0.9"
pandas = ">=2.0"
ultralytics = ">=8.3"
torch = ">=2.0,<2.3"
torchvision = ">=0.15,<0.18"
opencv-python = ">=4.8,<4.12"

[tool.poetry.group.dev.dependencies]
pytest = ">=7"
pytest-cov = ">=4"
ruff = ">=0.5"
mypy = ">=1.8"
pre-commit = ">=3.6"

[tool.poetry.scripts]
blenny = "blenny.cli.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore:Parameter `min_size` is deprecated:FutureWarning",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/blenny"]
