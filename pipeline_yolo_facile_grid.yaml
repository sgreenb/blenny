# Pipeline for analyzing multiple Petri plates in a consistent grid arrangement
# using the 'facile' algorithm for detection and YOLO for counting.

steps:
  - name: "load_image"
    params:
      # Native resolution is used so that each cropped plate can be
      # high-quality when passed to the sub-pipeline.
      max_dimension: null

  - name: "detect_multi_plate"
    params:
      grid: [3, 2]         # Change based on your scanner arrangement
      radius_scale: 1.0

  - name: "sub_pipeline"
    params:
      max_subplate_dimension: null
      steps:
        - name: apply_exclusion_mask
          params:
            mask_path: null

        - name: "yolo_detector"
          params:
            model_path: "models/colony_model.pt"
            conf_threshold: 0.15
            iou_threshold: 0.8
            imgsz: 3200
            max_det: 3000
            refine_mask: true
            output_key: "objects"

        - name: add_manual_colonies
          params:
            coordinates: []
        
        - name: "measure_colonies"
          params:
            mask_key: "objects"
            roi_mask_key: "plate"

        - name: filter_by_properties

        - name: filter_by_id
          params:
            exclude_ids: []
        
        - name: "export_annotated"
          params:
            output_path: "{output_dir}/{stem}/{stem}_{plate_label}_annotated.png"

  - name: "export_csv"
    params:
      output_path: "{output_dir}/{stem}/{stem}_colonies.csv"

  - name: "export_summary"
    params:
      output_path: "{output_dir}/{stem}/{stem}_log.txt"
